name: Build Pentest Dylib

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Compile Dylib
        run: |
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "Building with SDK: $SDK_PATH"
          
          clang -target arm64-apple-ios13.0 \
                -isysroot "$SDK_PATH" \
                -dynamiclib \
                -install_name @rpath/ViewInspector.dylib \
                -fobjc-arc \
                -framework UIKit \
                -framework Foundation \
                -framework CoreGraphics \
                -framework QuartzCore \
                -framework Vision \
                -O2 \
                ViewInspector.m -o ViewInspector.dylib

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ViewInspector.dylib
          path: ViewInspector.dylib
