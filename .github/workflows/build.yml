name: Build DriverHelper Dylib

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Xcode Environment
        run: |
          sudo xcode-select -switch /Applications/Xcode.app/Contents/Developer
          xcrun --sdk iphoneos --show-sdk-path

      - name: Compile Dylib with Clang
        run: |
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          
          # Tự động tìm đường dẫn ViewInspector.m và fishhook
          MAIN_SRC=$(find . -name "ViewInspector.m" -not -path "*/.*" | head -n 1)
          FISHHOOK_C=$(find . -name "fishhook.c" -not -path "*/.*" | head -n 1)
          FISHHOOK_H_DIR=$(find . -name "fishhook.h" -not -path "*/.*" -exec dirname {} \; | head -n 1)

          if [ -z "$MAIN_SRC" ]; then
            echo "::error::Khong tim thay file ViewInspector.m!"
            exit 1
          fi

          if [ -z "$FISHHOOK_C" ]; then
            echo "::error::Khong tim thay file fishhook.c!"
            exit 1
          fi

          if [ -z "$FISHHOOK_H_DIR" ]; then
            FISHHOOK_H_DIR="."
          fi

          echo "Compiling $MAIN_SRC and $FISHHOOK_C..."

          clang -isysroot "${SDK_PATH}" \
                -arch arm64 \
                -miphoneos-version-min=14.0 \
                -shared \
                -fobjc-arc \
                -I"${FISHHOOK_H_DIR}" \
                -framework UIKit \
                -framework Foundation \
                -framework CoreFoundation \
                -framework CoreGraphics \
                "${MAIN_SRC}" "${FISHHOOK_C}" \
                -o DriverHelper.dylib

      - name: Verify Dylib Architecture
        run: |
          file DriverHelper.dylib
          otool -L DriverHelper.dylib

      - name: Upload Dylib Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DriverHelper-Dylib
          path: DriverHelper.dylib
