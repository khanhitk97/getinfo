name: Build DriverHelper Dylib

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Xcode Environment
        run: |
          sudo xcode-select -switch /Applications/Xcode.app/Contents/Developer
          xcrun --sdk iphoneos --show-sdk-path

      - name: Compile Dylib with Clang
        run: |
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          
          clang -isysroot "${SDK_PATH}" \
                -arch arm64 \
                -miphoneos-version-min=14.0 \
                -shared \
                -fobjc-arc \
                -framework UIKit \
                -framework Foundation \
                -framework CoreFoundation \
                -framework CoreGraphics \
                DriverHelper.m fishhook.c \
                -o DriverHelper.dylib

      - name: Verify Dylib Architecture
        run: |
          file DriverHelper.dylib
          otool -L DriverHelper.dylib

      - name: Upload Dylib Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DriverHelper-Dylib
          path: DriverHelper.dylib
